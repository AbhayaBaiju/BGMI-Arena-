
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BGMI Arena | Payment Successful</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #050509;
        }

        .orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        .glow {
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.35);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md">

        <div class="bg-[#0d0d15] border border-green-500/30 rounded-2xl p-8 text-center glow">

            <!-- Success Icon -->
            <div class="mx-auto mb-6 w-20 h-20 rounded-full
                        bg-green-500/10 border border-green-500
                        flex items-center justify-center">

                <svg xmlns="http://www.w3.org/2000/svg"
                     class="w-10 h-10 text-green-400"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor"
                     stroke-width="2">

                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M5 13l4 4L19 7"/>
                </svg>

            </div>

            <!-- Title -->
            <h1 class="orbitron text-2xl font-bold text-green-400 mb-3">
                PAYMENT SUCCESSFUL
            </h1>

            <p class="text-gray-400 mb-6">
                Your tournament booking has been confirmed successfully.
            </p>

            <!-- Payment Details -->
            <div class="bg-black/40 rounded-xl p-5 text-left space-y-3 mb-6">

                <div class="flex justify-between">
                    <span class="text-gray-400">Tournament</span>
                    <span class="text-white font-medium">
                        {{ tournament.tournament_name }}
                    </span>
                </div>

                <div class="flex justify-between">
                    <span class="text-gray-400">Player</span>
                    <span class="text-white">
                        {{ booking.player_name }}
                    </span>
                </div>

                <div class="flex justify-between">
                    <span class="text-gray-400">BGMI ID</span>
                    <span class="text-cyan-400">
                        {{ booking.bgmi_id }}
                    </span>
                </div>

                <div class="border-t border-gray-700 pt-3 flex justify-between">
                    <span class="text-gray-400">Payment Status</span>
                    <span class="text-green-400 font-semibold">
                        PAID
                    </span>
                </div>

            </div>

            <!-- Button -->
            <a href="{% url 'player_dashboard' %}"
               class="block w-full py-3 rounded-xl
                      bg-gradient-to-r from-purple-600 to-cyan-500
                      hover:from-purple-500 hover:to-cyan-400
                      text-white font-semibold transition">

                GO TO DASHBOARD

            </a>

        </div>

        <p class="text-center text-gray-600 text-xs mt-5">
            BGMI ARENA • PLAY. COMPETE. CONQUER.
        </p>

    </div>

</body>
</html>
